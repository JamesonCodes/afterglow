<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Afterglow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">☾</span>
      <div>
        <h1>Afterglow</h1>
        <p>A softer side of the web.</p>
      </div>
    </header>
    <main>
      <section class="site">
        <span class="eyebrow">CURRENT WEBSITE</span>
        <h2 id="host">Loading…</h2>
        <p id="status" role="status" aria-live="polite">Checking theme…</p>
      </section>
      <label class="row"
        ><span
          >Enable Afterglow<small
            >Automatic dark mode across the web</small
          ></span
        ><input id="global" type="checkbox" role="switch" /></label
      ><label class="row"
        ><span
          >Enable on this site<small
            >Remember this website’s preference</small
          ></span
        ><input id="site" type="checkbox" role="switch" /></label
      ><label class="row"
        ><span
          >Force Afterglow<small
            >Apply even with a native dark theme</small
          ></span
        ><input id="force" type="checkbox" role="switch" /></label
      ><button id="reset">Reset site settings</button>
      <p id="hint"></p>
    </main>
    <footer>Charcoal nights. Original colors.</footer>
    <script src="popup.js"></script>
  </body>
</html>
