<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Afterglow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="mark" src="icons/128.png" width="44" height="44" alt="" />
      <div>
        <h1>Afterglow</h1>
        <p>A softer side of the web.</p>
      </div>
    </header>
    <main>
      <label class="row global"
        ><span
          >Afterglow across the web<small id="global-detail"
            >Automatic dark mode is on</small
          ></span
        ><input id="global" type="checkbox" role="switch" disabled
      /></label>
      <section class="site">
        <span class="eyebrow">CURRENT WEBSITE</span>
        <h2 id="host">Loading…</h2>
        <p id="status" role="status" aria-live="polite">Checking appearance…</p>
      </section>
      <fieldset id="modes" disabled aria-describedby="saved">
        <legend>Appearance for this site</legend>
        <label class="mode"
          ><input id="auto" type="radio" name="mode" value="auto" /><span
            ><strong>Automatic</strong
            ><small>Darken light pages; keep existing dark themes.</small></span
          ></label
        >
        <label class="mode"
          ><input
            id="original"
            type="radio"
            name="mode"
            value="original"
          /><span
            ><strong>Original site</strong
            ><small>Turn Afterglow off for this website.</small></span
          ></label
        >
      </fieldset>
      <label class="row accents"
        ><span
          >Afterglow accents<small
            >Soft glow on focused controls and hovered buttons.</small
          ></span
        ><input
          id="accents"
          type="checkbox"
          role="switch"
          aria-describedby="accents-detail"
          disabled
      /></label>
      <p id="accents-detail">Only with Afterglow’s dark theme.</p>
      <p id="saved">Saved for this website. Changes apply automatically.</p>
      <p id="hint" role="status" aria-live="polite"></p>
    </main>
    <footer>Charcoal nights. Original colors.</footer>
    <script src="popup.js"></script>
  </body>
</html>
